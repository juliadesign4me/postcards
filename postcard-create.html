@import url('https://fonts.googleapis.com/css2?family=Cabin+Sketch&family=Great+Vibes&family=Rye&display=swap');

/* Postcard card — shared layout (826×572 design canvas) */
.postcard-card{
  position:relative;
  width:826px;
  height:572px;
  flex:0 0 auto;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}

.postcard-card img{
  display:block;
  pointer-events:none;
}

/* Photo slot — 762×508 @ (32, 32) */
.pc-photo{
  position:absolute;
  left:32px;
  top:32px;
  width:762px;
  height:508px;
  border-radius:12px;
  overflow:hidden;
  z-index:3;
}
.pc-photo img,
.pc-photo canvas{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.pc-photo--empty{
  background:#d4d4d4;
  display:flex;
  align-items:center;
  justify-content:center;
}
.pc-upload-cta{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  opacity:.4;
}
.pc-upload-cta img{width:44px;height:44px;}
.pc-upload-cta span{
  font-family:Inter,system-ui,sans-serif;
  font-weight:500;
  font-size:18px;
  line-height:18px;
  color:#000;
}

/* Generic gray placeholder slot */
.pc-slot-gray{
  background:#d4d4d4;
}

/* Frame overlay — border ring under content */
.pc-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  pointer-events:none;
}

/* Title hint — per line */
.pc-line-hint{opacity:.3;}

/* ===== Modern — Front ===== */
.postcard-card--modern.postcard-card--front .pc-front-title,
.postcard-card--modern.postcard-card--front .pc-front-title .pc-underline{
  font-family:'Cabin Sketch',cursive;

}
.postcard-card--modern.postcard-card--front .pc-front-title{

  left:80px;
  top:360px;
  z-index:5;
  font-size:66px;
  line-height:66px;
  color:#000;
  white-space:normal;
}
.postcard-card--modern.postcard-card--front .pc-front-title .pc-underline{
  text-decoration:underline;
  text-decoration-thickness:2px;
  text-underline-offset:4px;
}

/* Stamp slot — reserved, empty by default */
.postcard-card--modern .pc-stamp-slot--front{
  position:absolute;
  left:627px;
  top:62px;
  width:137px;
  height:140px;
  z-index:4;
}
.postcard-card--modern .pc-stamp-slot--front img{
  width:100%;
  height:100%;

}

/* ===== Modern — Back ===== */
.postcard-card--modern.postcard-card--back{
  background:transparent;
}
.postcard-card--modern.postcard-card--back .pc-back-inner{
  position:absolute;

.postcard-card--modern .pc-message-text{

/* Title hint — back uses lighter ghost */

<style id="postcard-create">
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  min-height:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  background:#fff;
}

/* Create postcard page — Figma 1440×1024 */
.create-page{
  --ink:#0c0c0c;
  --bg:#fff;
  --border:rgba(0,0,0,.1);
  --fill-0:var(--page-frame-fill, #e7dde0);
  min-height:100%;
  width:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,sans-serif;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.create-stage-wrap{
  position:relative;
  flex:0 0 auto;
  margin:0 auto;
}

.create-stage{
  position:relative;
  width:1440px;
  height:1024px;
  flex:0 0 auto;
  transform-origin:top center;
  margin:0 auto;
}

.create-bg-deco{
  position:absolute;
  left:608px;
  top:35px;
  width:797px;
  height:954px;
  pointer-events:none;
  z-index:0;
  background:var(--page-frame-fill, #e7dde0);
  -webkit-mask-size:100% 100%;
  mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat;
  mask-repeat:no-repeat;
}

.create-divider-v{
  position:absolute;
  left:573px;
  top:0;
  width:1px;
  height:1024px;
  background:var(--border);
  z-index:1;
}

/* ===== Left panel ===== */
.create-panel{
  position:absolute;
  left:125px;
  top:0;
  width:408px;
  height:100%;
  z-index:2;
}

.create-topnav{
  position:absolute;
  left:125px;
  top:80px;
  display:flex;
  align-items:center;
  gap:32px;
  z-index:3;
}
.create-topnav a{
  display:block;
  width:32px;
  height:32px;
  flex-shrink:0;
}
.create-topnav a img{width:100%;height:100%;display:block;object-fit:contain;}
.create-side-tab{
  border:none;
  background:none;
  padding:0;
  cursor:pointer;
  font-family:'Instrument Serif',Georgia,serif;
  font-size:40px;
  line-height:40px;
  color:var(--ink);
  text-transform:lowercase;
}
.create-side-tab.is-active{
  font-style:italic;
  text-decoration:underline;
  text-underline-offset:4px;
}
.create-topnav-sep{
  width:1px;
  height:36px;
  background:var(--border);
  flex-shrink:0;
}

.create-field{
  position:absolute;
  left:0;
  width:408px;
}
.create-field--style{top:160px;}
.create-field--title{top:386px;}
.create-field--color{top:520px;width:373px;}
.create-field--stamp{top:630px;width:373px;}

/* Back panel fields */
.create-field--from{top:160px;}
.create-field--to{top:276px;}
.create-field--message{top:392px;}
.create-field--stickers{
  top:590px;
  width:auto;
  z-index:3;
  padding-bottom:24px;
}
.create-field--postmark-back{top:830px;width:153px;}
.create-field--postage-pick{top:830px;left:310px;width:auto;}

.create-textarea-wrap{
  display:flex;
  gap:16px;
  align-items:flex-start;
  min-height:120px;
  padding:16px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
}
.create-textarea-wrap img{width:24px;height:24px;flex-shrink:0;margin-top:2px;display:block;}
.create-textarea-wrap textarea{
  flex:1;
  border:none;
  outline:none;
  resize:none;
  min-height:88px;
  font-family:Inter,system-ui,sans-serif;
  font-size:18px;
  font-weight:500;
  color:var(--ink);
  background:transparent;
  line-height:1.4;
}
.create-textarea-wrap textarea::placeholder{color:rgba(0,0,0,.6);}

.create-picker-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  max-width:408px;
  margin-bottom:12px;
}
.create-picker-item{
  width:64px;
  height:64px;
  padding:4px;
  border:2px solid transparent;
  border-radius:4px;
  background:transparent;
  cursor:pointer;
  flex-shrink:0;
  transition:border-color .2s ease,opacity .2s ease;
}
.create-picker-item img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  border-radius:2px;
  pointer-events:none;
}
.create-picker-item.is-active{border-color:var(--ink);}
.create-picker-item.is-dim{opacity:.5;}

.create-postage-pick{
  display:flex;
  gap:10px;
}
.create-postage-item{
  position:relative;
  width:46px;
  height:64px;
  padding:0;
  border:2px solid transparent;
  background:none;
  cursor:pointer;
  flex-shrink:0;
  opacity:.5;
  transition:border-color .2s ease,opacity .2s ease;
}
.create-postage-item.is-active{
  border-color:var(--ink);
  opacity:1;
}
.create-postage-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  pointer-events:none;
}
.create-postage-art{
  position:absolute;
  left:10%;
  top:7%;

<script type="module">
import { savePostcard } from './src/postcardStorage.js';
import { compressImageFile, validateImageFile } from './src/imageUpload.js';
import { applyCreatePageAssets } from './assets/create-page-assets.js';

applyCreatePageAssets();
const STAMP_GHOST_OPACITY = 0.35;
const STAMP_BACK_GHOST_OPACITY = 0.4;

function assetBasePath(src){
  return src ? src.split('?')[0] : '';
}

function assetPathMatch(a, b){
  return assetBasePath(a) === assetBasePath(b);
}

function stampOptionSelected(selected, options){
  return options.some(opt => assetPathMatch(opt, selected));
}

const createPage = document.getElementById('createPage');
const createStageWrap = document.getElementById('createStageWrap');
const createStage = document.getElementById('createStage');
const cardFlip = document.getElementById('cardFlip');
const previewFront = document.getElementById('previewFront');
const previewBack = document.getElementById('previewBack');
const titleInput = document.getElementById('titleInput');
const fromInput = document.getElementById('fromInput');
const toInput = document.getElementById('toInput');
const messageInput = document.getElementById('messageInput');
const fileInput = document.getElementById('fileInput');
const stickerFileInput = document.getElementById('stickerFileInput');
const postageFileInput = document.getElementById('postageFileInput');
const btnFlip = document.getElementById('btnFlip');
const previewWrap = document.getElementById('previewWrap');
const btnNext = document.getElementById('btnNext');
const btnFinish = document.getElementById('btnFinish');
const stickerPicker = document.getElementById('stickerPicker');
const frontPostmarkPicker = document.getElementById('frontPostmarkPicker');
const backPostmarkPicker = document.getElementById('backPostmarkPicker');
const postagePicker = document.getElementById('postagePicker');

let currentStyle = 'modern';
let currentSide = 'front';
let cardData = Object.assign({}, (typeof PostcardCard !== 'undefined' && PostcardCard.DEFAULT_DATA) || {}, {
  stickers: [null, null, null, null],
});
let selectedFrontStamp = null;
let selectedBackStamp = null;
let selectedPostage = null;
let activeStickerSlot = null;
let pendingPhotoBlob = null;
let photoPreviewUrl = null;

function setPhotoPreview(blob){
  if(photoPreviewUrl){
    URL.revokeObjectURL(photoPreviewUrl);
  }
  pendingPhotoBlob = blob;
  photoPreviewUrl = blob ? URL.createObjectURL(blob) : null;
  cardData.photo = photoPreviewUrl;
}

function placeSticker(src){
  const idx = cardData.stickers.findIndex(s => assetPathMatch(s, src));
  if(idx !== -1){
    cardData.stickers[idx] = null;
    return;
  }
  const empty = cardData.stickers.findIndex(s => !s);
  if(empty !== -1) cardData.stickers[empty] = src;
}

function remapStickersForStyle(fromStyle, toStyle){
  const from = PostcardCard.stickerOptionsForStyle(fromStyle);
  const to = PostcardCard.stickerOptionsForStyle(toStyle);
  cardData.stickers = cardData.stickers.map(src=>{
    if(!src) return null;
    const idx = from.findIndex(opt => assetPathMatch(opt.src, src));
    if(idx !== -1) return to[idx].src;
    const base = assetBasePath(src).split('/').pop();
    const match = to.find(opt => assetBasePath(opt.src).endsWith('/' + base));
    return match ? match.src : src;
  });
}

function syncStickerPickerUI(){
  const options = PostcardCard.stickerOptionsForStyle(currentStyle);
  const usedBases = new Set(cardData.stickers.filter(Boolean).map(assetBasePath));
  stickerPicker.querySelectorAll('.create-picker-item').forEach(btn=>{
    const i = Number(btn.dataset.index);
    const src = options[i] ? options[i].src : '';
    btn.classList.toggle('is-active', Boolean(src && usedBases.has(assetBasePath(src))));
    btn.classList.remove('is-dim');
  });
}

function parseTitleLines(raw){
  const text = raw.trim();
  if(!text) return { line1: '', line2: '' };
  const space = text.indexOf(' ');
  if(space === -1) return { line1: text, line2: '' };
  return {
    line1: text.slice(0, space).trim(),
    line2: text.slice(space + 1).trim(),
  };
}

function exportData(){
  const d = Object.assign({}, cardData);
  if(selectedFrontStamp){
    d.stampFront = selectedFrontStamp;
    d.stampFrontOpacity = 1;
  }
  if(selectedBackStamp){
    d.stampBack = selectedBackStamp;
    d.stampBackOpacity = 1;
  }
  if(selectedPostage) d.postageArt = selectedPostage;
  return d;
}

function previewDataFor(side){
  const d = Object.assign({}, cardData);
  if(side === 'front'){
    if(selectedFrontStamp){
      d.stampFront = selectedFrontStamp;
      d.stampFrontOpacity = 1;
    } else if(PostcardCard.ghostStampForStyle){
      d.stampFront = PostcardCard.ghostStampForStyle(currentStyle, 'front');
      d.stampFrontOpacity = STAMP_GHOST_OPACITY;
    }
  } else {
    if(selectedBackStamp){
      d.stampBack = selectedBackStamp;
      d.stampBackOpacity = 1;
    } else if(PostcardCard.ghostStampForStyle){
      d.stampBack = PostcardCard.ghostStampForStyle(currentStyle, 'back');
      d.stampBackOpacity = STAMP_BACK_GHOST_OPACITY;
    }
    if(selectedPostage) d.postageArt = selectedPostage;
  }
  return d;
}

function bindFrontInteractions(root){
  const photo = root.querySelector('.pc-photo');
  if(photo){
    photo.addEventListener('click', ()=> fileInput.click());
  }
}

function bindBackInteractions(root){
  root.querySelectorAll('.pc-sticker-slot').forEach(slot=>{
    slot.addEventListener('click', ()=>{
      const i = Number(slot.dataset.slot.replace('sticker-', ''));
      if(slot.classList.contains('pc-sticker-slot--empty')){
        activeStickerSlot = i;
        stickerFileInput.click();
        return;
      }
      cardData.stickers[i] = null;
      syncStickerPickerUI();
      mountPreview();
    });
  });
  const postageSlot = root.querySelector('.pc-postage-slot--empty');
  if(postageSlot){
    postageSlot.addEventListener('click', ()=> postageFileInput.click());
  }
}

function mountPreview(){
  if(typeof PostcardCard === 'undefined' || !PostcardCard.createElement || !previewFront || !previewBack) return;
  previewFront.replaceChildren(
    PostcardCard.createElement(currentStyle, 'front', previewDataFor('front'))
  );
  previewBack.replaceChildren(
    PostcardCard.createElement(currentStyle, 'back', previewDataFor('back'))
  );
  bindFrontInteractions(previewFront);
  bindBackInteractions(previewBack);
  fitPreview();
}

function setSide(side){
  if(side === currentSide || cardFlip.classList.contains('is-flipping')) return;
  const isBack = side === 'back';
  currentSide = side;
  createPage.classList.toggle('is-back', isBack);
  document.querySelectorAll('.create-panel-front').forEach(el=>{ el.hidden = isBack; });
  document.querySelectorAll('.create-panel-back').forEach(el=>{ el.hidden = !isBack; });
  document.querySelectorAll('.create-side-tab').forEach(tab=>{
    tab.classList.toggle('is-active', tab.dataset.side === side);
  });
  runFlipAnimation(isBack);
}

const FLIP_MS = 650;
const FLIP_EASE = 'cubic-bezier(.4,0,.2,1)';

function getPreviewScale(){
  return getComputedStyle(cardFlip).getPropertyValue('--preview-scale').trim() || '1';
}

function runFlipAnimation(toBack){
  const scale = getPreviewScale();
  const half = FLIP_MS / 2;
  cardFlip.classList.add('is-flipping', toBack ? 'show-front' : 'show-back');
  cardFlip.classList.toggle('is-flipped', !toBack);

  cardFlip.style.transition = 'transform ' + half + 'ms ' + FLIP_EASE;
  cardFlip.style.transform = 'scale(' + scale + ') rotateY(' + (toBack ? 90 : -90) + 'deg)';

  window.setTimeout(() => {
    cardFlip.classList.toggle('is-flipped', toBack);
    cardFlip.classList.remove('show-front', 'show-back');
    cardFlip.classList.add(toBack ? 'show-back' : 'show-front');
    cardFlip.style.transition = 'none';
    cardFlip.style.transform = 'scale(' + scale + ') rotateY(' + (toBack ? -90 : 90) + 'deg)';

    requestAnimationFrame(() => {
      cardFlip.style.transition = 'transform ' + half + 'ms ' + FLIP_EASE;
      cardFlip.style.transform = 'scale(' + scale + ') rotateY(0deg)';

      window.setTimeout(() => {
        cardFlip.classList.remove('is-flipping', 'show-front', 'show-back');
        cardFlip.style.transition = '';
        cardFlip.style.transform = '';
      }, half);
    });
  }, half);
}

const PREVIEW_CARD_W = 826;
const PREVIEW_CARD_H = 572;
const DESKTOP_PREVIEW_W = 670;
const DESIGN_W = 1440;
const DESIGN_H = 1024;

function fitPreview(){
  const wrap = document.querySelector('.create-preview-wrap');
  if(!wrap) return;

  const mobile = window.matchMedia('(max-width:900px)').matches;
  if(mobile){
    wrap.style.width = '';
    wrap.style.height = '';
    const targetW = wrap.getBoundingClientRect().width || Math.min(window.innerWidth - 20, 420);
    const scale = targetW / PREVIEW_CARD_W;
    cardFlip.style.setProperty('--preview-scale', String(scale));
    return;
  }

  const targetW = DESKTOP_PREVIEW_W;
  const scale = targetW / PREVIEW_CARD_W;
  const targetH = PREVIEW_CARD_H * scale;

  cardFlip.style.setProperty('--preview-scale', String(scale));
  wrap.style.width = targetW + 'px';
  wrap.style.height = targetH + 'px';
}

function fitStage(){
  const mobile = window.matchMedia('(max-width:900px)').matches;
  createStage.style.transform = '';
  createStage.style.transformOrigin = '';
  createStage.style.width = '';
  createStage.style.height = '';
  createStage.style.margin = '';
  createStage.style.zoom = '';
  if(createStageWrap){
    createStageWrap.style.width = '';
    createStageWrap.style.height = '';
    createStageWrap.style.overflow = '';
  }

  if(mobile){
    createPage.style.overflow = 'hidden';
    document.body.style.alignItems = 'stretch';
    document.body.style.overflow = 'hidden';
    fitPreview();
    return;
  }

  const scale = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H, 1);
  createPage.style.overflow = scale < 1 ? 'auto' : 'hidden';
  document.body.style.alignItems = scale < 1 ? 'flex-start' : 'center';
  document.body.style.overflow = scale < 1 ? 'auto' : 'hidden';

  if(scale < 1){
    createStage.style.transform = `scale(${scale})`;
    createStage.style.transformOrigin = 'top left';
    createStage.style.width = `${DESIGN_W}px`;
    createStage.style.height = `${DESIGN_H}px`;
    if(createStageWrap){
      createStageWrap.style.width = `${Math.ceil(DESIGN_W * scale)}px`;
      createStageWrap.style.height = `${Math.ceil(DESIGN_H * scale)}px`;
      createStageWrap.style.overflow = 'hidden';
    }
  }

  fitPreview();
}

function scheduleFitStage(){
  fitStage();
  requestAnimationFrame(fitStage);
}

function buildStickerPicker(){
  if(!stickerPicker || !PostcardCard.stickerOptionsForStyle) return;
  stickerPicker.replaceChildren();
  PostcardCard.stickerOptionsForStyle(currentStyle).forEach((opt, i)=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'create-picker-item';
    btn.dataset.index = String(i);
    btn.title = opt.label;
    btn.innerHTML = '<img src="' + opt.src + '" alt="' + opt.label + '">';
    btn.addEventListener('click', ()=>{
      placeSticker(opt.src);
      syncStickerPickerUI();
      mountPreview();
    });
    stickerPicker.appendChild(btn);
  });
  syncStickerPickerUI();
}

function buildFrontStampPicker(){
  if(!frontPostmarkPicker || !PostcardCard.frontStampOptionsForStyle) return;
  frontPostmarkPicker.replaceChildren();
  const options = PostcardCard.frontStampOptionsForStyle(currentStyle);
  if(selectedFrontStamp && !stampOptionSelected(selectedFrontStamp, options)){
    selectedFrontStamp = null;
  }
  options.forEach((src, i)=>{
    const withPlate = PostcardCard.stampNeedsPlate(src);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'create-stamp' + (withPlate ? ' create-stamp--with-plate' : '');
    btn.dataset.stamp = src;
    btn.setAttribute('role', 'radio');
    btn.setAttribute('aria-checked', assetPathMatch(selectedFrontStamp, src) ? 'true' : 'false');
    if(assetPathMatch(selectedFrontStamp, src)) btn.classList.add('is-active');
    btn.innerHTML =
      (withPlate ? '<span class="create-stamp-plate" aria-hidden="true"></span>' : '') +
      '<img src="' + src + '" alt="Postmark style ' + (i + 1) + '">';
    btn.addEventListener('click', ()=>{
      if(assetPathMatch(selectedFrontStamp, src)){
        selectedFrontStamp = null;
        btn.classList.remove('is-active');
        btn.setAttribute('aria-checked', 'false');
      } else {
        selectedFrontStamp = src;
        frontPostmarkPicker.querySelectorAll('.create-stamp').forEach(b=>{
          b.classList.toggle('is-active', b === btn);
          b.setAttribute('aria-checked', b === btn ? 'true' : 'false');
        });
      }
      mountPreview();
    });
    frontPostmarkPicker.appendChild(btn);
  });
}

function buildBackStampPicker(){
  if(!backPostmarkPicker || !PostcardCard.backStampOptionsForStyle) return;
  backPostmarkPicker.replaceChildren();
  const options = PostcardCard.backStampOptionsForStyle(currentStyle);
  if(selectedBackStamp && !stampOptionSelected(selectedBackStamp, options)){
    selectedBackStamp = null;
  }
  options.forEach((src, i)=>{
    const withPlate = PostcardCard.stampNeedsPlate(src);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'create-stamp' + (withPlate ? ' create-stamp--with-plate' : '');
    btn.dataset.stamp = src;
    btn.setAttribute('role', 'radio');
    btn.setAttribute('aria-checked', assetPathMatch(selectedBackStamp, src) ? 'true' : 'false');
    if(assetPathMatch(selectedBackStamp, src)) btn.classList.add('is-active');
    btn.innerHTML =
      (withPlate ? '<span class="create-stamp-plate" aria-hidden="true"></span>' : '') +
      '<img src="' + src + '" alt="Back postmark ' + (i + 1) + '">';
    btn.addEventListener('click', ()=>{
      if(assetPathMatch(selectedBackStamp, src)){
        selectedBackStamp = null;
        btn.classList.remove('is-active');
        btn.setAttribute('aria-checked', 'false');
      } else {
        selectedBackStamp = src;
        backPostmarkPicker.querySelectorAll('.create-stamp').forEach(b=>{
          b.classList.toggle('is-active', b === btn);
          b.setAttribute('aria-checked', b === btn ? 'true' : 'false');
        });
      }
      mountPreview();
    });
    backPostmarkPicker.appendChild(btn);
  });
}

function buildPostagePicker(){
  if(!postagePicker || !PostcardCard.postageOptionsForStyle || !PostcardCard.postageFrameForStyle) return;
  postagePicker.replaceChildren();
  const options = PostcardCard.postageOptionsForStyle(currentStyle);
  const frameSrc = PostcardCard.postageFrameForStyle(currentStyle);
  if(selectedPostage && !stampOptionSelected(selectedPostage, options)){
    selectedPostage = null;
  }
  options.forEach(src=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'create-postage-item';
    btn.dataset.postage = src;
    if(assetPathMatch(selectedPostage, src)){
      btn.classList.add('is-active');
      btn.setAttribute('aria-checked', 'true');
    }
    btn.innerHTML =
      '<img class="create-postage-frame" src="' + frameSrc + '" alt="">' +
      '<img class="create-postage-art" src="' + src + '" alt="">';
    btn.addEventListener('click', ()=>{
      if(assetPathMatch(selectedPostage, src)){
        selectedPostage = null;
        btn.classList.remove('is-active');
        btn.setAttribute('aria-checked', 'false');
      } else {
        selectedPostage = src;
        postagePicker.querySelectorAll('.create-postage-item').forEach(b=>{
          b.classList.toggle('is-active', b === btn);
          b.setAttribute('aria-checked', b === btn ? 'true' : 'false');
        });
      }
      mountPreview();
    });
    postagePicker.appendChild(btn);
  });
}

function buildPickers(){
  buildStickerPicker();
  buildFrontStampPicker();
  buildBackStampPicker();
  buildPostagePicker();
}

titleInput.addEventListener('input', ()=>{
  const t = parseTitleLines(titleInput.value);
  cardData.titleLine1 = t.line1;
  cardData.titleLine2 = t.line2;
  mountPreview();
});

fromInput.addEventListener('input', ()=>{
  cardData.from = fromInput.value;
  mountPreview();
});

toInput.addEventListener('input', ()=>{
  cardData.to = toInput.value;
  mountPreview();
});

messageInput.addEventListener('input', ()=>{
  const fitted = PostcardCard.fitMessage(messageInput.value);
  if(fitted !== messageInput.value){
    const pos = fitted.length;
    messageInput.value = fitted;
    messageInput.setSelectionRange(pos, pos);
  }
  cardData.message = fitted;
  mountPreview();
});

function syncTitleColorPicker(hex){
  const retroPink = (typeof PostcardCard !== 'undefined' && PostcardCard.RETRO_DEFAULT_TITLE_COLOR) || '#ffe0eb';
  document.querySelectorAll('.create-panel-front .create-color').forEach(b=>{
    const active = b.dataset.hex === hex
      || (hex === retroPink && b.dataset.color === 'pink');
    b.classList.toggle('is-active', active);
    b.setAttribute('aria-checked', active ? 'true' : 'false');
  });
}

document.querySelectorAll('.create-panel-front .create-color').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    cardData.titleColor = btn.dataset.hex;
    syncTitleColorPicker(btn.dataset.hex);
    mountPreview();
  });
});

document.querySelectorAll('.create-style-card').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const prevStyle = currentStyle;
    currentStyle = btn.dataset.style;
    remapStickersForStyle(prevStyle, currentStyle);
    document.querySelectorAll('.create-style-card').forEach(b=> b.classList.remove('is-active'));
    btn.classList.add('is-active');
    const url = new URL(location.href);
    if(currentStyle === 'modern'){
      url.searchParams.delete('style');
    } else {
      url.searchParams.set('style', currentStyle);
    }
    history.replaceState(null, '', url);
    if(window.PageTheme) window.PageTheme.applyPageTheme();
    buildStickerPicker();
    buildFrontStampPicker();
    buildBackStampPicker();
    buildPostagePicker();
    if(currentStyle === 'retro70'){
      syncTitleColorPicker(cardData.titleColor || PostcardCard.RETRO_DEFAULT_TITLE_COLOR);
    }
    if(currentStyle === 'vintage'){
      syncTitleColorPicker(cardData.titleColor || PostcardCard.VINTAGE_DEFAULT_TITLE_COLOR);
    }
    mountPreview();
  });
});

document.querySelectorAll('.create-side-tab').forEach(tab=>{
  tab.addEventListener('click', ()=> setSide(tab.dataset.side));
});

function isCardControlTarget(target){
  return Boolean(target.closest(
    '.pc-photo, .pc-sticker-slot, .pc-postage-slot--empty, .pc-upload-cta, .pc-slot-upload, input, textarea, button, a, label'
  ));
}

function togglePreviewSide(){
  setSide(currentSide === 'front' ? 'back' : 'front');
}

function handlePreviewFlip(e){
  if(cardFlip.classList.contains('is-flipping')) return;
  if(isCardControlTarget(e.target)) return;
  togglePreviewSide();
}

if(previewWrap){
  previewWrap.addEventListener('click', handlePreviewFlip);
  previewWrap.addEventListener('keydown', (e)=>{
    if(e.key !== 'Enter' && e.key !== ' ') return;
    if(isCardControlTarget(e.target)) return;
    e.preventDefault();
    handlePreviewFlip(e);
  });
}

btnFlip.addEventListener('click', togglePreviewSide);

btnNext.addEventListener('click', ()=> setSide('back'));

btnFinish.addEventListener('click', async ()=>{
  try {
    btnFinish.disabled = true;
    const payload = {
      style: currentStyle,
      data: exportData(),
    };
    const id = await savePostcard(payload, { photoBlob: pendingPhotoBlob });
    const shareUrl = new URL('postcard-share.html', window.location.href);
    shareUrl.searchParams.set('id', id);
    if(currentStyle !== 'modern'){
      shareUrl.searchParams.set('style', currentStyle);
    }
    window.location.href = shareUrl.href;
  } catch(err){
    console.error(err);
    alert(err.message || 'Could not save postcard');
    btnFinish.disabled = false;
  }
});

fileInput.addEventListener('change', async ()=>{
  const file = fileInput.files[0];
  fileInput.value = '';
  if(!file) return;
  try {
    validateImageFile(file);
    const blob = await compressImageFile(file);
    setPhotoPreview(blob);
    mountPreview();
  } catch(err){
    console.error(err);
    alert(err.message || 'Could not load image');
  }
});

stickerFileInput.addEventListener('change', ()=>{
  const file = stickerFileInput.files[0];
  if(!file || activeStickerSlot == null) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    cardData.stickers[activeStickerSlot] = e.target.result;
    syncStickerPickerUI();
    mountPreview();
    stickerFileInput.value = '';
    activeStickerSlot = null;
  };
  reader.readAsDataURL(file);
});

postageFileInput.addEventListener('change', ()=>{
  const file = postageFileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    selectedPostage = e.target.result;
    cardData.postageArt = e.target.result;
    postagePicker.querySelectorAll('.create-postage-item').forEach(b=>{
      b.classList.remove('is-active');
      b.setAttribute('aria-checked', 'false');
    });
    mountPreview();
    postageFileInput.value = '';
  };
  reader.readAsDataURL(file);
});

(function initStyleFromUrl(){
  const style = new URLSearchParams(location.search).get('style');
  if(!style) return;
  const btn = document.querySelector('.create-style-card[data-style="' + style + '"]');
  if(!btn) return;
  currentStyle = style;
  document.querySelectorAll('.create-style-card').forEach(b=> b.classList.remove('is-active'));
  btn.classList.add('is-active');
  if(style === 'retro70'){
    const retroPink = PostcardCard.RETRO_DEFAULT_TITLE_COLOR || '#ffe0eb';
    cardData.titleColor = retroPink;
    syncTitleColorPicker(retroPink);
  }
  if(style === 'vintage'){
    const vintageCream = PostcardCard.VINTAGE_DEFAULT_TITLE_COLOR || '#f6eed8';
    cardData.titleColor = vintageCream;
    syncTitleColorPicker(vintageCream);
  }
  if(window.PageTheme) window.PageTheme.applyPageTheme(currentStyle);
})();

function safeBuildPickers(){
  if(typeof PostcardCard === 'undefined'){
    console.error('[create] postcard-card.js failed to load');
    return;
  }
  try {
    buildPickers();
  } catch (err) {
    console.error('[create] buildPickers failed', err);
  }
}

function initPreview(){
  try {
    mountPreview();
  } catch (err) {
    console.error('[create] mountPreview failed', err);
  }
}

safeBuildPickers();
initPreview();
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(initPreview);
}
scheduleFitStage();
window.addEventListener('resize', scheduleFitStage);
window.addEventListener('orientationchange', scheduleFitStage);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', scheduleFitStage);
}
</script>
