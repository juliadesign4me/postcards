<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postcard Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch&family=Homemade+Apple&family=Instrument+Serif:ital@0;1&family=Abyssinica+SIL&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/immersive.css">
<link rel="stylesheet" href="assets/postcard-card.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:#484036;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Instrument Serif',Georgia,serif;
}

#stage-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
}

#stage{
  position:relative;
  width:826px;
  height:572px;
  flex:0 0 auto;
  transform-origin:center center;
  perspective:1200px;
}

#card-flip{
  position:relative;
  width:100%;
  height:100%;
  transform-origin:center center;
  transform:scale(var(--stage-scale, 1)) rotateY(0deg);
  will-change:transform;
}

#card-front,
#card-back{
  position:absolute;
  inset:0;
}
#card-flip.is-flipping.show-front #card-front,
#card-flip:not(.is-back):not(.is-flipping) #card-front{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
#card-flip.is-flipping.show-front #card-back,
#card-flip:not(.is-back):not(.is-flipping) #card-back{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
#card-flip.is-flipping.show-back #card-back,
#card-flip.is-back:not(.is-flipping) #card-back{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
#card-flip.is-flipping.show-back #card-front,
#card-flip.is-back:not(.is-flipping) #card-front{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

#style-tabs{
  display:flex;
  gap:8px;
  justify-content:center;
}
.style-tab{
  padding:8px 20px;
  border:2px solid rgba(238,220,205,.35);
  background:transparent;
  color:rgba(238,220,205,.7);
  font-family:'Instrument Serif',Georgia,serif;
  font-size:18px;
  cursor:pointer;
  transition:all .2s ease;
}
.style-tab:hover{border-color:rgba(238,220,205,.6);color:#eedccd;}
.style-tab.is-active{
  border-color:#eedccd;
  color:#eedccd;
  background:rgba(238,220,205,.08);
}
.style-tab:disabled{opacity:.35;cursor:default;}
.style-tab:disabled:hover{border-color:rgba(238,220,205,.35);color:rgba(238,220,205,.7);background:transparent;}

#controls{
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
}
.take{
  display:flex;align-items:center;justify-content:center;gap:16px;
  min-width:160px;height:56px;padding:10px 32px;
  border:2px solid #eedccd;background:transparent;cursor:pointer;
  transition:background .25s ease,transform .15s ease,opacity .25s ease;
}
.take:hover{background:rgba(238,220,205,0.12);}
.take:active{transform:scale(.97);}
.take img{width:28px;height:28px;object-fit:contain;display:block;}
.take span{font-family:'Instrument Serif',Georgia,serif;color:#eedccd;font-size:22px;white-space:nowrap;}
.take:disabled{opacity:.35;cursor:default;}
.take:disabled:hover{background:transparent;}

#status{
  text-align:center;
  font-family:'Abyssinica SIL',Georgia,serif;
  font-size:13px;
  color:rgba(238,220,205,0.7);
  text-transform:uppercase;
  min-height:18px;
}

.page-breadcrumb{
  position:fixed;left:14px;top:12px;z-index:101;
  display:flex;align-items:center;gap:8px;
  font-family:'Instrument Serif',Georgia,serif;
  font-size:15px;color:rgba(238,220,205,0.55);
}
.page-breadcrumb a{
  display:inline-flex;align-items:center;gap:6px;
  color:rgba(238,220,205,0.85);text-decoration:none;
  transition:color .2s ease;
}
.page-breadcrumb a:hover{color:#eedccd;}
.page-breadcrumb .crumb-arrow{font-size:20px;line-height:1;}
.page-breadcrumb .sep{opacity:.4;user-select:none;}
.page-breadcrumb [aria-current="page"]{color:rgba(238,220,205,0.5);font-style:italic;}

.credit-instagram{
  position:fixed;right:14px;top:12px;z-index:100;
  display:flex;align-items:center;gap:6px;
  text-decoration:none;color:rgba(238,220,205,0.6);
  font-family:'Abyssinica SIL',Georgia,serif;font-size:18px;line-height:26px;
  transition:color .2s ease;
}
.credit-instagram:hover{color:#eedccd;}
.credit-instagram svg{width:18px;height:18px;flex-shrink:0;}
</style>
</head>
<body>

<nav class="page-breadcrumb" aria-label="Breadcrumb">
  <a href="index.html">
    <span class="crumb-arrow" aria-hidden="true">←</span>
    <span>Home</span>
  </a>
  <span class="sep" aria-hidden="true">/</span>
  <span aria-current="page">Postcard</span>
</nav>

<div id="stage-wrap">
  <div id="style-tabs" role="tablist" aria-label="Card style">
    <button class="style-tab is-active" type="button" data-style="modern" role="tab" aria-selected="true">Modern</button>
    <button class="style-tab" type="button" data-style="retro70" role="tab" aria-selected="false">Retro 70s</button>
    <button class="style-tab" type="button" data-style="vintage" role="tab" aria-selected="false">Vintage</button>
  </div>

  <div id="stage">
    <div id="card-flip">
      <div id="card-front"></div>
      <div id="card-back"></div>
    </div>
  </div>

  <div id="controls">
    <button id="btnFlip" class="take" type="button">
      <span>flip card</span>
    </button>
    <button id="btnUpload" class="take" type="button">
      <img src="assets/post-card-80-upload-icon.png" alt="">
      <span>upload photo</span>
    </button>
    <button id="btnDownload" class="take" type="button">
      <span>download</span>
    </button>
  </div>

  <div id="status" role="status" aria-live="polite">Tap upload to add your photo</div>
</div>

<input id="fileInput" type="file" accept="image/*" hidden>

<a class="credit-instagram" href="https://instagram.com/design4me__" target="_blank" rel="noopener noreferrer" aria-label="made by @design4me__ on Instagram">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.75" fill="currentColor" stroke="none"/></svg>
  <span>made by @design4me__</span>
</a>

<script src="assets/immersive.js"></script>
<script type="module" src="assets/postcard-card.js"></script>
<script>
const cardFront = document.getElementById('card-front');
const cardBack = document.getElementById('card-back');
const cardFlip = document.getElementById('card-flip');
const fileInput = document.getElementById('fileInput');
const btnUpload = document.getElementById('btnUpload');
const btnFlip = document.getElementById('btnFlip');
const btnDownload = document.getElementById('btnDownload');
const status = document.getElementById('status');

let currentStyle = 'modern';
let cardData = Object.assign({}, PostcardCard.DEFAULT_DATA);
let showingBack = false;

function mountCards(){
  cardFront.replaceChildren(PostcardCard.createElement(currentStyle, 'front', cardData));
  cardBack.replaceChildren(PostcardCard.createElement(currentStyle, 'back', cardData));
}

function setStyle(style){
  if(style === currentStyle || !PostcardCard.STYLES[style]) return;
  currentStyle = style;
  document.querySelectorAll('.style-tab').forEach(tab=>{
    const active = tab.dataset.style === style;
    tab.classList.toggle('is-active', active);
    tab.setAttribute('aria-selected', active ? 'true' : 'false');
  });
  mountCards();
}

document.querySelectorAll('.style-tab').forEach(tab=>{
  tab.addEventListener('click', ()=> setStyle(tab.dataset.style));
});

(function initStyleFromUrl(){
  const style = new URLSearchParams(location.search).get('style');
  if(!style || !PostcardCard.STYLES[style]) return;
  currentStyle = style;
  document.querySelectorAll('.style-tab').forEach(tab=>{
    const active = tab.dataset.style === style;
    tab.classList.toggle('is-active', active);
    tab.setAttribute('aria-selected', active ? 'true' : 'false');
  });
})();

function fitStage(){
  const stage = document.getElementById('stage');
  const mobile = window.matchMedia('(max-width:820px)').matches;
  const scale = mobile
    ? Math.min(window.innerWidth * 0.92, 826) / 826
    : Math.min(window.innerWidth / 960, window.innerHeight / 780, 1);
  stage.style.transform = '';
  cardFlip.style.setProperty('--stage-scale', String(scale));
}

const FLIP_MS = 650;
const FLIP_EASE = 'cubic-bezier(.4,0,.2,1)';

function getStageScale(){
  return getComputedStyle(cardFlip).getPropertyValue('--stage-scale').trim() || '1';
}

function runFlipAnimation(toBack){
  const scale = getStageScale();
  const half = FLIP_MS / 2;
  cardFlip.classList.add('is-flipping', toBack ? 'show-front' : 'show-back');
  cardFlip.classList.toggle('is-back', !toBack);

  cardFlip.style.transition = 'transform ' + half + 'ms ' + FLIP_EASE;
  cardFlip.style.transform = 'scale(' + scale + ') rotateY(' + (toBack ? 90 : -90) + 'deg)';

  window.setTimeout(() => {
    cardFlip.classList.toggle('is-back', toBack);
    cardFlip.classList.remove('show-front', 'show-back');
    cardFlip.classList.add(toBack ? 'show-back' : 'show-front');
    cardFlip.style.transition = 'none';
    cardFlip.style.transform = 'scale(' + scale + ') rotateY(' + (toBack ? -90 : 90) + 'deg)';

    requestAnimationFrame(() => {
      cardFlip.style.transition = 'transform ' + half + 'ms ' + FLIP_EASE;
      cardFlip.style.transform = 'scale(' + scale + ') rotateY(0deg)';

      window.setTimeout(() => {
        cardFlip.classList.remove('is-flipping', 'show-front', 'show-back');
        cardFlip.style.transition = '';
        cardFlip.style.transform = '';
      }, half);
    });
  }, half);
}

btnFlip.addEventListener('click', ()=>{
  if(cardFlip.classList.contains('is-flipping')) return;
  showingBack = !showingBack;
  runFlipAnimation(showingBack);
  btnFlip.querySelector('span').textContent = showingBack ? 'show front' : 'flip card';
});

btnUpload.addEventListener('click', ()=> fileInput.click());

fileInput.addEventListener('change', ()=>{
  const file = fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    cardData.photo = e.target.result;
    mountCards();
    status.textContent = 'Photo added — flip or download';
    fileInput.value = '';
  };
  reader.readAsDataURL(file);
});

btnDownload.addEventListener('click', async ()=>{
  status.textContent = 'Rendering…';
  btnDownload.disabled = true;
  try {
    const side = showingBack ? 'back' : 'front';
    const url = await PostcardCard.toDataURL(currentStyle, side, cardData, 2);
    const a = document.createElement('a');
    a.download = 'postcard-' + side + '-' + Date.now() + '.png';
    a.href = url;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    status.textContent = 'Saved';
  } catch(err){
    console.error(err);
    status.textContent = 'Export failed';
  } finally {
    btnDownload.disabled = false;
  }
});

mountCards();
BoothImmersive.mountAmbient();
fitStage();
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', fitStage);
</script>
</body>
</html>
