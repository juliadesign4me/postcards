<!DOCTYPE html>
<html lang="uk" data-style="modern">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postcard Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/frame-background.css">
<link rel="stylesheet" href="assets/welcome.css">
<link rel="stylesheet" href="assets/mobile-responsive.css">
<script src="assets/frame-background.js"></script>
</head>
<body>
<div class="welcome-sheet frame-sheet" id="welcomeSheet" aria-hidden="true">
  <svg class="welcome-stamp frame-stamp" id="welcomeStamp" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="none" overflow="visible">
    <defs>
      <mask id="stampMask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse">
        <rect id="stampMaskFill" fill="#fff"/>
        <g id="stampHoleCircles" fill="#000"/>
      </mask>
    </defs>
    <rect id="stampFill" mask="url(#stampMask)"/>
  </svg>
</div>

<div class="welcome-page frame-page" id="welcomePage" data-style="modern">
  <div class="welcome-stage-wrap" id="welcomeStageWrap">
  <div class="welcome-stage" id="welcomeStage">

    <img class="welcome-logo" src="assets/welcome/shared/logo.png" alt="Postcard Maker">

    <div class="welcome-left">
      <div class="welcome-copy">
        <h1 class="welcome-heading">
          <em>create</em><br>
          your own<br>
          <u>postcard</u>
        </h1>
        <p class="welcome-lead">Make a postcard in any style and send it to someone you miss.</p>
      </div>

      <form class="welcome-waitlist" id="welcomeWaitlist" novalidate>
        <label class="welcome-waitlist-label" for="waitlistEmail">Your email</label>
        <input
          type="email"
          id="waitlistEmail"
          class="welcome-waitlist-input"
          name="email"
          autocomplete="email"
          inputmode="email"
          placeholder="you@example.com"
          required
        >
        <button type="submit" class="welcome-waitlist-submit" id="waitlistSubmit">
          <span class="welcome-waitlist-submit-icon" aria-hidden="true">
            <img src="assets/welcome/shared/btn-stamp-outer.svg" alt="">
            <img src="assets/welcome/shared/btn-stamp-inner.svg" alt="">
          </span>
          <span class="welcome-waitlist-submit-label">Join the waitlist</span>
        </button>
        <p class="welcome-waitlist-error" id="waitlistError" hidden role="alert"></p>
      </form>

      <div class="welcome-waitlist-success" id="waitlistSuccess" hidden aria-live="polite">
        <p class="welcome-waitlist-success-text">We&apos;ll let you know!</p>
      </div>
    </div>

    <div class="welcome-preview" id="welcomePreview" aria-hidden="true">
      <div class="preview-compose">
        <img class="welcome-envelope" src="assets/welcome/modern/envelope.png" alt="">
        <img class="welcome-card-back" src="assets/welcome/modern/back.png" alt="">
        <img class="welcome-card-front" src="assets/welcome/modern/front.png" alt="Modern postcard preview">
      </div>
    </div>

  </div>
  </div>
</div>

<script type="module">
import { joinWaitlist } from './src/waitlist.js';

const welcomePage = document.getElementById('welcomePage');
const welcomeStageWrap = document.getElementById('welcomeStageWrap');
const welcomeStage = document.getElementById('welcomeStage');
const welcomeSheet = document.getElementById('welcomeSheet');
const welcomeStamp = document.getElementById('welcomeStamp');
const stampFill = document.getElementById('stampFill');
const stampMask = document.getElementById('stampMask');
const stampMaskFill = document.getElementById('stampMaskFill');
const stampHoleCircles = document.getElementById('stampHoleCircles');
const welcomeWaitlist = document.getElementById('welcomeWaitlist');
const waitlistEmail = document.getElementById('waitlistEmail');
const waitlistSubmit = document.getElementById('waitlistSubmit');
const waitlistError = document.getElementById('waitlistError');
const waitlistSuccess = document.getElementById('waitlistSuccess');

const frameBg = FrameBackground.create({
  sheet: welcomeSheet,
  stamp: welcomeStamp,
  stampFill,
  stampMask,
  stampMaskFill,
  stampHoleCircles,
});

const { DESIGN_W, DESIGN_H } = FrameBackground;

function getWelcomeInset(){
  return frameBg.getInset();
}

function fitStampSheet(){
  frameBg.fitStampSheet();
}

function fitStage(){
  const mobile = window.matchMedia('(max-width:900px)').matches;
  welcomeStage.style.transform = '';
  welcomeStage.style.width = '';
  welcomeStage.style.height = '';
  welcomeStage.style.margin = '';
  welcomeStage.style.transformOrigin = '';
  welcomePage.style.overflow = mobile ? 'hidden' : '';
  if(welcomeStageWrap){
    welcomeStageWrap.style.width = '';
    welcomeStageWrap.style.height = '';
    welcomeStageWrap.style.overflow = '';
  }
  if(mobile){
    fitStampSheet();
    return;
  }
  const inset = getWelcomeInset();
  const vpW = window.innerWidth;
  const vpH = window.innerHeight;
  const availW = vpW - inset * 2;
  const availH = vpH - inset * 2;
  const scale = Math.min(availW / DESIGN_W, availH / DESIGN_H, 1);
  welcomePage.style.overflow = scale < 1 ? 'auto' : 'hidden';
  if(scale < 1){
    welcomeStage.style.transform = `scale(${scale})`;
    welcomeStage.style.transformOrigin = 'top left';
    welcomeStage.style.width = `${DESIGN_W}px`;
    welcomeStage.style.height = `${DESIGN_H}px`;
    welcomeStage.style.margin = '0';
    if(welcomeStageWrap){
      welcomeStageWrap.style.width = `${Math.ceil(DESIGN_W * scale)}px`;
      welcomeStageWrap.style.height = `${Math.ceil(DESIGN_H * scale)}px`;
      welcomeStageWrap.style.overflow = 'hidden';
    }
  }
  fitStampSheet();
}

function showWaitlistSuccess(){
  welcomeWaitlist.hidden = true;
  welcomeWaitlist.style.display = 'none';
  waitlistError.hidden = true;
  waitlistSuccess.hidden = false;
  waitlistSuccess.style.display = '';
}

function showWaitlistError(message){
  waitlistError.textContent = message;
  waitlistError.hidden = false;
}

welcomeWaitlist.addEventListener('submit', async (e)=>{
  e.preventDefault();
  waitlistError.hidden = true;
  waitlistSubmit.disabled = true;

  try {
    await joinWaitlist(waitlistEmail.value);
    showWaitlistSuccess();
  } catch (err) {
    console.error(err);
    showWaitlistError(err.message || 'Something went wrong. Please try again.');
    waitlistSubmit.disabled = false;
  }
});

FrameBackground.applyTheme(welcomePage, 'modern');

function scheduleFit(){
  fitStage();
  requestAnimationFrame(fitStage);
}

scheduleFit();
window.addEventListener('resize', scheduleFit);
window.addEventListener('orientationchange', scheduleFit);
window.addEventListener('load', scheduleFit);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', scheduleFit);
}
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(scheduleFit);
}
</script>
</body>
</html>
